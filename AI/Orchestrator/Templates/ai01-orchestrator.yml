name: AI01 Orchestrator

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to route
        required: true
        type: number
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  route:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/ai01 '))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Protect PR 7
        if: steps.pr.outputs.number == '7'
        shell: bash
        run: |
          echo "PR #7 is protected out-of-scope for AI01-008."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Evaluate parallel gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./tools/orchestrator/router.ps1 -PrNumber ${{ steps.pr.outputs.number }} -Repository ${{ github.repository }}
