name: VSP RC2 Release Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vsp-rc2-release-evidence-b0df5fa9341b3c56a515e93b5f770d1f1c172530
  cancel-in-progress: false

env:
  RC2_SOURCE_SHA: b0df5fa9341b3c56a515e93b5f770d1f1c172530
  RC2_ARTIFACT_NAME: vsp-rc2-release-evidence-b0df5fa9341b3c56a515e93b5f770d1f1c172530
  RC2_PACKAGE_NAME: VSP_v1.0.0-RC2_win-x64.zip

jobs:
  release-evidence:
    name: RC2 Release Evidence (Windows self-hosted)
    runs-on: [self-hosted, Windows, X64, vsp-server]
    timeout-minutes: 90
    defaults:
      run:
        # The runner blocks PowerShell script files. Use cmd and invoke only
        # narrowly scoped inline PowerShell commands where Windows APIs are needed.
        shell: cmd

    steps:
      - name: Initialize immutable run evidence
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          WORKFLOW_DEFINITION_REF: ${{ github.workflow_ref }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          WORKFLOW_HOST_MAIN_SHA: ${{ github.sha }}
        run: |
          set "RC2_EVIDENCE_ROOT=%RUNNER_TEMP%\vsp-rc2-evidence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "RC2_PUBLISH_ROOT=%RUNNER_TEMP%\vsp-rc2-publish-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "RC2_SMOKE_ROOT=%RUNNER_TEMP%\vsp-rc2-smoke-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          >>"%GITHUB_ENV%" echo RC2_EVIDENCE_ROOT=%RUNNER_TEMP%\vsp-rc2-evidence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%
          >>"%GITHUB_ENV%" echo RC2_PUBLISH_ROOT=%RUNNER_TEMP%\vsp-rc2-publish-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%
          >>"%GITHUB_ENV%" echo RC2_SMOKE_ROOT=%RUNNER_TEMP%\vsp-rc2-smoke-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%
          if exist "%RC2_EVIDENCE_ROOT%" rmdir /s /q "%RC2_EVIDENCE_ROOT%"
          mkdir "%RC2_EVIDENCE_ROOT%"
          mkdir "%RC2_EVIDENCE_ROOT%\logs"
          mkdir "%RC2_EVIDENCE_ROOT%\test-results"
          >"%RC2_EVIDENCE_ROOT%\provenance.txt" echo RC2_SOURCE_SHA=%RC2_SOURCE_SHA%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo WORKFLOW_HOST_MAIN_SHA=%WORKFLOW_HOST_MAIN_SHA%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo WORKFLOW_DEFINITION_REF=%WORKFLOW_DEFINITION_REF%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo WORKFLOW_DEFINITION_SHA=%WORKFLOW_DEFINITION_SHA%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_REF=%GITHUB_REF%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_SHA=%GITHUB_SHA%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_RUN_ID=%GITHUB_RUN_ID%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_RUN_NUMBER=%GITHUB_RUN_NUMBER%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_RUN_ATTEMPT=%GITHUB_RUN_ATTEMPT%
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo GITHUB_EVENT_NAME=%GITHUB_EVENT_NAME%
          if not "%GITHUB_EVENT_NAME%"=="workflow_dispatch" exit /b 1
          if not "%GITHUB_REF%"=="refs/heads/main" exit /b 1
          if not "%GITHUB_RUN_ATTEMPT%"=="1" (
            >>"%RC2_EVIDENCE_ROOT%\failure.txt" echo Re-run attempts cannot be authoritative RC2 evidence.
            exit /b 1
          )
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $headers=@{ Accept='application/vnd.github+json'; Authorization=('Bearer ' + $env:ACTIONS_READ_TOKEN); 'X-GitHub-Api-Version'='2022-11-28' }; $uri=('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/actions/workflows/vsp-rc2-release-evidence.yml/runs?event=workflow_dispatch&per_page=100'); $response=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers; $currentRunNumber=[long]$env:GITHUB_RUN_NUMBER; $earlier=@($response.workflow_runs | Where-Object { [long]$_.run_number -lt $currentRunNumber }); ('EARLIER_DISPATCH_COUNT=' + $earlier.Count) | Add-Content -LiteralPath (Join-Path $env:RC2_EVIDENCE_ROOT 'provenance.txt') -Encoding ascii; if ($earlier.Count -gt 0) { 'An earlier workflow_dispatch run already exists; this dispatch is non-authoritative.' | Add-Content -LiteralPath (Join-Path $env:RC2_EVIDENCE_ROOT 'failure.txt') -Encoding ascii; throw 'Subsequent RC2 dispatch rejected before source checkout and test execution' }"

      - name: Checkout exact approved RC2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC2_SOURCE_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source identity
        run: |
          for /f %%S in ('git rev-parse HEAD') do set CHECKED_OUT_SHA=%%S
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo CHECKED_OUT_SHA=%CHECKED_OUT_SHA%
          git show -s --format=fuller HEAD>> "%RC2_EVIDENCE_ROOT%\provenance.txt"
          if /i not "%CHECKED_OUT_SHA%"=="%RC2_SOURCE_SHA%" (
            >>"%RC2_EVIDENCE_ROOT%\failure.txt" echo Checked-out HEAD does not equal RC2_SOURCE_SHA.
            exit /b 1
          )
          git status --short --untracked-files=no>> "%RC2_EVIDENCE_ROOT%\provenance.txt"

      - name: Verify .NET 10 SDK
        run: |
          dotnet --info> "%RC2_EVIDENCE_ROOT%\logs\dotnet-info.log" 2>&1
          set DOTNET_INFO_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\dotnet-info.log"
          if not "%DOTNET_INFO_EXIT%"=="0" exit /b %DOTNET_INFO_EXIT%
          dotnet --list-sdks> "%RC2_EVIDENCE_ROOT%\logs\dotnet-sdks.log" 2>&1
          type "%RC2_EVIDENCE_ROOT%\logs\dotnet-sdks.log"
          dotnet --list-sdks | findstr /B /C:"10." >nul
          if errorlevel 1 (
            >>"%RC2_EVIDENCE_ROOT%\failure.txt" echo Required .NET 10 SDK not found.
            exit /b 1
          )

      - name: Clean Release outputs
        run: |
          dotnet clean VSP.slnx -c Release> "%RC2_EVIDENCE_ROOT%\logs\clean-release.log" 2>&1
          set CLEAN_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\clean-release.log"
          if not "%CLEAN_EXIT%"=="0" exit /b %CLEAN_EXIT%

      - name: Restore
        run: |
          dotnet restore VSP.slnx> "%RC2_EVIDENCE_ROOT%\logs\restore.log" 2>&1
          set RESTORE_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\restore.log"
          if not "%RESTORE_EXIT%"=="0" exit /b %RESTORE_EXIT%

      - name: Build Release
        run: |
          dotnet build VSP.slnx -c Release --no-restore> "%RC2_EVIDENCE_ROOT%\logs\build-release.log" 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\build-release.log"
          if not "%BUILD_EXIT%"=="0" exit /b %BUILD_EXIT%

      - name: Authoritative full Release test
        run: |
          dotnet test VSP.Tests\VSP.Tests.csproj -c Release --no-build --logger "trx;LogFileName=VSP.Tests.Release.trx" --results-directory "%RC2_EVIDENCE_ROOT%\test-results"> "%RC2_EVIDENCE_ROOT%\logs\test-release.log" 2>&1
          set TEST_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\test-release.log"
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo AUTHORITATIVE_TEST_EXIT=%TEST_EXIT%
          if not "%TEST_EXIT%"=="0" (
            >>"%RC2_EVIDENCE_ROOT%\failure.txt" echo Authoritative full Release test failed; rerun-to-green is prohibited.
            exit /b %TEST_EXIT%
          )

      - name: Publish self-contained win-x64
        run: |
          if exist "%RC2_PUBLISH_ROOT%" rmdir /s /q "%RC2_PUBLISH_ROOT%"
          mkdir "%RC2_PUBLISH_ROOT%"
          dotnet publish VSP.UI\VSP.UI.csproj -c Release /p:PublishProfile=win-x64 -o "%RC2_PUBLISH_ROOT%"> "%RC2_EVIDENCE_ROOT%\logs\publish-win-x64.log" 2>&1
          set PUBLISH_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\publish-win-x64.log"
          if not "%PUBLISH_EXIT%"=="0" exit /b %PUBLISH_EXIT%
          if not exist "%RC2_PUBLISH_ROOT%\VSP.UI.exe" exit /b 1
          if not exist "%RC2_PUBLISH_ROOT%\coreclr.dll" exit /b 1
          if not exist "%RC2_PUBLISH_ROOT%\hostfxr.dll" exit /b 1

      - name: Package and calculate SHA-256
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $zip=Join-Path $env:RC2_EVIDENCE_ROOT $env:RC2_PACKAGE_NAME; Compress-Archive -Path (Join-Path $env:RC2_PUBLISH_ROOT '*') -DestinationPath $zip -Force; $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash; ($hash + '  ' + $env:RC2_PACKAGE_NAME) | Set-Content -LiteralPath (Join-Path $env:RC2_EVIDENCE_ROOT ($env:RC2_PACKAGE_NAME + '.sha256')) -Encoding ascii; Write-Output ('SHA256=' + $hash)" > "%RC2_EVIDENCE_ROOT%\logs\package.log" 2>&1
          set PACKAGE_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\package.log"
          if not "%PACKAGE_EXIT%"=="0" exit /b %PACKAGE_EXIT%

      - name: Launch smoke outside repository without dotnet on child PATH
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class NativeWindowProbe { [DllImport(\"user32.dll\")] [return: MarshalAs(UnmanagedType.Bool)] public static extern bool IsHungAppWindow(IntPtr hWnd); }'; $process=$null; try { if (Test-Path -LiteralPath $env:RC2_SMOKE_ROOT) { Remove-Item -LiteralPath $env:RC2_SMOKE_ROOT -Recurse -Force }; New-Item -ItemType Directory -Path $env:RC2_SMOKE_ROOT | Out-Null; $extract=Join-Path $env:RC2_SMOKE_ROOT 'app'; $localAppData=Join-Path $env:RC2_SMOKE_ROOT 'LocalAppData'; New-Item -ItemType Directory -Path $extract,$localAppData | Out-Null; $zip=Join-Path $env:RC2_EVIDENCE_ROOT $env:RC2_PACKAGE_NAME; Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force; $childPath=(($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)(^|\\)(dotnet|\.dotnet)(\\|$)' -and $_ -notmatch '(?i)Microsoft\\dotnet' -and $_ -notmatch '(?i)Program Files\\dotnet' }) -join ';'; $probeInfo=New-Object System.Diagnostics.ProcessStartInfo; $probeInfo.FileName='where.exe'; $probeInfo.Arguments='dotnet'; $probeInfo.UseShellExecute=$false; $probeInfo.RedirectStandardOutput=$true; $probeInfo.RedirectStandardError=$true; $probeInfo.EnvironmentVariables['PATH']=$childPath; $probe=[System.Diagnostics.Process]::Start($probeInfo); $probe.WaitForExit(); $probeOutput=$probe.StandardOutput.ReadToEnd()+$probe.StandardError.ReadToEnd(); Write-Output ('where dotnet exit=' + $probe.ExitCode); Write-Output $probeOutput; if ($probe.ExitCode -eq 0) { throw 'dotnet remains reachable on child PATH' }; $exe=Join-Path $extract 'VSP.UI.exe'; if (-not (Test-Path -LiteralPath $exe)) { throw 'VSP.UI.exe is missing from extracted package' }; $startInfo=New-Object System.Diagnostics.ProcessStartInfo; $startInfo.FileName=$exe; $startInfo.WorkingDirectory=$extract; $startInfo.UseShellExecute=$false; $startInfo.EnvironmentVariables['PATH']=$childPath; $startInfo.EnvironmentVariables['LOCALAPPDATA']=$localAppData; $process=[System.Diagnostics.Process]::Start($startInfo); $deadline=[DateTime]::UtcNow.AddSeconds(20); do { Start-Sleep -Milliseconds 500; $process.Refresh(); if ($process.HasExited) { throw ('VSP.UI.exe exited before showing Login Window; exit=' + $process.ExitCode) } } while ($process.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline); if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Login Window handle was not created within 20 seconds' }; foreach ($probeNumber in 1..2) { $process.Refresh(); Write-Output ('probe=' + $probeNumber + '; title=' + $process.MainWindowTitle + '; responding=' + $process.Responding + '; handle=' + $process.MainWindowHandle); if ($process.HasExited) { throw 'VSP.UI.exe exited during responsiveness validation' }; if ($process.MainWindowTitle -cne 'VSP - Login') { throw ('Unexpected Login Window title: ' + $process.MainWindowTitle) }; if (-not $process.Responding) { throw 'VSP.UI.exe is not responding' }; if ([NativeWindowProbe]::IsHungAppWindow($process.MainWindowHandle)) { throw 'Login Window is reported as hung' }; if ($probeNumber -eq 1) { Start-Sleep -Seconds 5 } }; if (-not $process.CloseMainWindow()) { throw 'Login Window refused CloseMainWindow' }; if (-not $process.WaitForExit(10000)) { throw 'VSP.UI.exe did not terminate cleanly within 10 seconds' }; Write-Output ('clean exit=' + $process.ExitCode) } finally { if ($null -ne $process -and -not $process.HasExited) { Write-Output 'forcing process cleanup after failed smoke'; $process.Kill(); $process.WaitForExit() }; if (Test-Path -LiteralPath $env:RC2_SMOKE_ROOT) { Remove-Item -LiteralPath $env:RC2_SMOKE_ROOT -Recurse -Force } }" > "%RC2_EVIDENCE_ROOT%\logs\launch-smoke.log" 2>&1
          set SMOKE_EXIT=%ERRORLEVEL%
          type "%RC2_EVIDENCE_ROOT%\logs\launch-smoke.log"
          >>"%RC2_EVIDENCE_ROOT%\provenance.txt" echo LAUNCH_SMOKE_EXIT=%SMOKE_EXIT%
          if not "%SMOKE_EXIT%"=="0" exit /b %SMOKE_EXIT%

      - name: Record job summary
        if: always()
        env:
          RC2_JOB_STATUS: ${{ job.status }}
        run: |
          >"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo # VSP RC2 Release Evidence
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo.
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo - RC2 source SHA: `%RC2_SOURCE_SHA%`
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo - Workflow host main SHA: `%GITHUB_SHA%`
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo - Run ID: `%GITHUB_RUN_ID%`
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo - Run attempt: `%GITHUB_RUN_ATTEMPT%`
          >>"%RC2_EVIDENCE_ROOT%\RUN_SUMMARY.md" echo - Job status at summary: `%RC2_JOB_STATUS%`

      - name: Upload RC2 evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RC2_ARTIFACT_NAME }}
          path: ${{ env.RC2_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean runner temporary data after preserved upload
        if: always() && steps.upload-evidence.outcome == 'success'
        run: |
          if exist "%RC2_PUBLISH_ROOT%" rmdir /s /q "%RC2_PUBLISH_ROOT%"
          if exist "%RC2_SMOKE_ROOT%" rmdir /s /q "%RC2_SMOKE_ROOT%"
          if exist "%RC2_EVIDENCE_ROOT%" rmdir /s /q "%RC2_EVIDENCE_ROOT%"
