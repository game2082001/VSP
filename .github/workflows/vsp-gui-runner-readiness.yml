name: VSP GUI Runner Readiness

on:
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: vsp-gui-runner-readiness
  cancel-in-progress: false

jobs:
  validate-interactive-gui-runner:
    name: Interactive GUI Runner Readiness (not RC2 validation)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'game2082001'
    runs-on: [self-hosted, Windows, X64, vsp-gui, interactive-desktop]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    steps:
      - name: Initialize immutable readiness evidence
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          WORKFLOW_DEFINITION_REF: ${{ github.workflow_ref }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
        run: |
          set "READINESS_EVIDENCE_ROOT=%RUNNER_TEMP%\vsp-gui-readiness-evidence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "READINESS_HELPER_SOURCE=%RUNNER_TEMP%\vsp-gui-readiness-probe-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.cs"
          set "READINESS_HELPER_EXE=%RUNNER_TEMP%\vsp-gui-readiness-probe-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.exe"
          >>"%GITHUB_ENV%" echo READINESS_EVIDENCE_ROOT=%RUNNER_TEMP%\vsp-gui-readiness-evidence-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%
          >>"%GITHUB_ENV%" echo READINESS_HELPER_SOURCE=%RUNNER_TEMP%\vsp-gui-readiness-probe-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.cs
          >>"%GITHUB_ENV%" echo READINESS_HELPER_EXE=%RUNNER_TEMP%\vsp-gui-readiness-probe-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.exe
          if exist "%READINESS_EVIDENCE_ROOT%" rmdir /s /q "%READINESS_EVIDENCE_ROOT%"
          if exist "%READINESS_HELPER_SOURCE%" del /q "%READINESS_HELPER_SOURCE%"
          if exist "%READINESS_HELPER_EXE%" del /q "%READINESS_HELPER_EXE%"
          mkdir "%READINESS_EVIDENCE_ROOT%"
          mkdir "%READINESS_EVIDENCE_ROOT%\provenance"
          mkdir "%READINESS_EVIDENCE_ROOT%\runner"
          mkdir "%READINESS_EVIDENCE_ROOT%\probe"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $runPath=Join-Path $env:READINESS_EVIDENCE_ROOT 'provenance\run.txt'; @('READINESS_RESULT=NOT_EVALUATED','RC2_RELEASE_RESULT=NOT_EVALUATED','RC2_001_AUTHORITATIVE_RUN=32561743888','RC2_001_DISPOSITION=AUTHORITATIVE_FAIL','RC2_002_DIAGNOSTIC_RUN=32571209557','RC2_003_AUTHORITATIVE_FAIL_RUN=32587312778','RC2_003_AUTHORITATIVE_FAIL_CLASSIFICATION=READINESS_WORKFLOW_DEFECT_MATERIALIZATION','RC2_003B_AUTHORITATIVE_FAIL_RUN=32611054978','RC2_003B_AUTHORITATIVE_FAIL_CLASSIFICATION=READINESS_WORKFLOW_DEFECT_WINDOW_OBSERVABILITY','RC2_003C_AUTHORITATIVE_FAIL_RUN=32618714861','RC2_003C_AUTHORITATIVE_FAIL_CLASSIFICATION=READINESS_WORKFLOW_DEFECT_UNICODE_ANSI_INTEROP',('GITHUB_RUN_ID=' + $env:GITHUB_RUN_ID),('GITHUB_RUN_NUMBER=' + $env:GITHUB_RUN_NUMBER),('GITHUB_RUN_ATTEMPT=' + $env:GITHUB_RUN_ATTEMPT),('GITHUB_EVENT_NAME=' + $env:GITHUB_EVENT_NAME),('GITHUB_REF=' + $env:GITHUB_REF),('GITHUB_SHA=' + $env:GITHUB_SHA),('GITHUB_ACTOR=' + $env:GITHUB_ACTOR),('RUNNER_NAME=' + $env:RUNNER_NAME),('RUNNER_OS=' + $env:RUNNER_OS),('RUNNER_ARCH=' + $env:RUNNER_ARCH),('WORKFLOW_DEFINITION_REF=' + $env:WORKFLOW_DEFINITION_REF),('WORKFLOW_DEFINITION_SHA=' + $env:WORKFLOW_DEFINITION_SHA)) | Set-Content -LiteralPath $runPath -Encoding utf8; if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw 'Event is not workflow_dispatch' }; if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Workflow must run from refs/heads/main' }; if ($env:GITHUB_ACTOR -ine 'game2082001') { throw 'Workflow actor is not the approved Product Owner' }; if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'Re-run attempts cannot be authoritative RC2-003 evidence' }; if ($env:RUNNER_NAME -ine 'VSP-GUI-01') { throw 'Job was not routed to VSP-GUI-01' }; if ($env:RUNNER_OS -ine 'Windows') { throw 'Runner OS is not Windows' }; if ($env:RUNNER_ARCH -ine 'X64') { throw 'Runner architecture is not X64' }; $headers=@{ Accept='application/vnd.github+json'; Authorization=('Bearer ' + $env:ACTIONS_READ_TOKEN); 'X-GitHub-Api-Version'='2022-11-28' }; $uri=('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/actions/workflows/vsp-gui-runner-readiness.yml/runs?event=workflow_dispatch&per_page=100'); $response=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers; $current=[long]$env:GITHUB_RUN_NUMBER; $acceptedPrior=@(32587312778,32611054978,32618714861); $earlier=@($response.workflow_runs | Where-Object { [long]$_.run_number -lt $current }); $nonAcceptedEarlier=@($earlier | Where-Object { [long]$_.id -notin $acceptedPrior }); ('EARLIER_READINESS_DISPATCH_COUNT=' + $earlier.Count) | Add-Content -LiteralPath $runPath -Encoding utf8; ('ACCEPTED_PRIOR_READINESS_WORKFLOW_DEFECT_RUNS=' + ($acceptedPrior -join ',')) | Add-Content -LiteralPath $runPath -Encoding utf8; ('NON_ACCEPTED_EARLIER_READINESS_DISPATCH_COUNT=' + $nonAcceptedEarlier.Count) | Add-Content -LiteralPath $runPath -Encoding utf8; if ($nonAcceptedEarlier.Count -gt 0) { 'A non-accepted prior RC2-003 workflow_dispatch exists; this run is non-authoritative.' | Set-Content -LiteralPath (Join-Path $env:READINESS_EVIDENCE_ROOT 'provenance\guard-failure.txt') -Encoding utf8; throw 'Subsequent RC2-003 dispatch rejected before GUI probe execution' }"

      - name: Materialize non-VSP interactive desktop probe
        env:
          READINESS_PROBE_SOURCE: |
            using System;
            using System.Collections.Generic;
            using System.Diagnostics;
            using System.Globalization;
            using System.IO;
            using System.Runtime.InteropServices;
            using System.Security.Principal;
            using System.Text;
            using System.Threading;

            internal static class VspGuiRunnerReadinessProbe
            {
                private const uint WM_NULL = 0x0000;
                private const uint WM_CLOSE = 0x0010;
                private const uint WM_DESTROY = 0x0002;
                private const uint SMTO_ABORTIFHUNG = 0x0002;
                private const uint DESKTOP_READOBJECTS = 0x0001;
                private const uint DESKTOP_ENUMERATE = 0x0040;
                private const uint CS_HREDRAW = 0x0002;
                private const uint CS_VREDRAW = 0x0001;
                private const uint WS_OVERLAPPEDWINDOW = 0x00CF0000;
                private const uint WS_VISIBLE = 0x10000000;
                private const int CW_USEDEFAULT = unchecked((int)0x80000000);
                private const int SW_SHOWNORMAL = 1;
                private const int COLOR_WINDOW = 5;
                private const int GWL_STYLE = -16;
                private const int GWL_EXSTYLE = -20;
                private const int UOI_NAME = 2;
                private const int WTS_USER_NAME = 5;
                private const int WTS_WINSTATION_NAME = 6;
                private const int WTS_DOMAIN_NAME = 7;
                private const int WTS_CONNECT_STATE = 8;
                private const int WTS_ACTIVE = 0;
                private const string ExpectedAccount = @"Yousin\game2082001";
                private const string ExpectedSid = "S-1-5-21-246760006-3988060075-516279282-1001";
                private const string ExpectedRunner = "VSP-GUI-01";
                private const string ProbeTitle = "VSP GUI Runner Readiness Probe";
                private const string ProbeWindowClass = "VspGuiRunnerReadinessProbeWindow";

                private delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr parameter);
                private delegate IntPtr WindowProc(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam);

                [StructLayout(LayoutKind.Sequential)]
                private struct RECT
                {
                    public int Left;
                    public int Top;
                    public int Right;
                    public int Bottom;
                }

                private sealed class WindowRecord
                {
                    public IntPtr Handle;
                    public uint ProcessId;
                    public uint ThreadId;
                    public string Title;
                    public string ClassName;
                    public long Style;
                    public long ExtendedStyle;
                    public bool Exists;
                    public bool Visible;
                    public bool Enabled;
                    public bool Hung;
                    public bool Responsive;
                    public int ResponsivenessError;
                    public bool IsUnicode;
                    public int ExpectedTitleLength;
                    public int GetWindowTextLengthReturn;
                    public int GetWindowTextReturn;
                    public int ActualTitleLength;
                    public RECT Rect;
                }

                private sealed class EnumerationRecord
                {
                    public string Api;
                    public bool ApiResult;
                    public int LastError;
                    public int CallbackCount;
                    public readonly List<WindowRecord> ProcessWindows = new List<WindowRecord>();
                    public WindowRecord MatchingWindow;
                }

                [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
                private struct WNDCLASS
                {
                    public uint Style;
                    public WindowProc WindowProcedure;
                    public int ClassExtraBytes;
                    public int WindowExtraBytes;
                    public IntPtr Instance;
                    public IntPtr Icon;
                    public IntPtr Cursor;
                    public IntPtr Background;
                    public string MenuName;
                    public string ClassName;
                }

                [StructLayout(LayoutKind.Sequential)]
                private struct POINT
                {
                    public int X;
                    public int Y;
                }

                [StructLayout(LayoutKind.Sequential)]
                private struct MSG
                {
                    public IntPtr Hwnd;
                    public uint Message;
                    public IntPtr WParam;
                    public IntPtr LParam;
                    public uint Time;
                    public POINT Point;
                }

                [DllImport("user32.dll", SetLastError = true)]
                private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr parameter);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern bool EnumThreadWindows(uint threadId, EnumWindowsProc callback, IntPtr parameter);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern bool EnumDesktopWindows(IntPtr desktop, EnumWindowsProc callback, IntPtr parameter);
                [DllImport("user32.dll")]
                private static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint processId);
                [DllImport("user32.dll", EntryPoint = "GetWindowTextW", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
                private static extern int GetWindowTextW(IntPtr hwnd, StringBuilder text, int count);
                [DllImport("user32.dll", EntryPoint = "GetWindowTextLengthW", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
                private static extern int GetWindowTextLengthW(IntPtr hwnd);
                [DllImport("user32.dll", EntryPoint = "GetClassNameW", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
                private static extern int GetClassNameW(IntPtr hwnd, StringBuilder className, int count);
                [DllImport("user32.dll")]
                private static extern bool IsWindow(IntPtr hwnd);
                [DllImport("user32.dll", EntryPoint = "IsWindowUnicode", ExactSpelling = true)]
                private static extern bool IsWindowUnicode(IntPtr hwnd);
                [DllImport("user32.dll")]
                private static extern bool IsWindowVisible(IntPtr hwnd);
                [DllImport("user32.dll")]
                private static extern bool IsWindowEnabled(IntPtr hwnd);
                [DllImport("user32.dll")]
                private static extern bool IsHungAppWindow(IntPtr hwnd);
                [DllImport("user32.dll")]
                private static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
                [DllImport("user32.dll", EntryPoint = "GetWindowLongPtrW", ExactSpelling = true)]
                private static extern IntPtr GetWindowLongPtr(IntPtr hwnd, int index);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern IntPtr SendMessageTimeout(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam, uint flags, uint timeout, out IntPtr result);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern bool PostMessage(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam);
                [DllImport("user32.dll", EntryPoint = "RegisterClassW", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
                private static extern ushort RegisterClassW(ref WNDCLASS windowClass);
                [DllImport("user32.dll", EntryPoint = "CreateWindowExW", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
                private static extern IntPtr CreateWindowExW(uint exStyle, string className, string windowName, uint style, int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr parameter);
                [DllImport("user32.dll")]
                private static extern bool ShowWindow(IntPtr hwnd, int command);
                [DllImport("user32.dll")]
                private static extern bool UpdateWindow(IntPtr hwnd);
                [DllImport("user32.dll")]
                private static extern bool DestroyWindow(IntPtr hwnd);
                [DllImport("user32.dll", EntryPoint = "DefWindowProcW", CharSet = CharSet.Unicode, ExactSpelling = true)]
                private static extern IntPtr DefWindowProcW(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern int GetMessage(out MSG message, IntPtr hwnd, uint minMessage, uint maxMessage);
                [DllImport("user32.dll")]
                private static extern bool TranslateMessage(ref MSG message);
                [DllImport("user32.dll", EntryPoint = "DispatchMessageW", CharSet = CharSet.Unicode, ExactSpelling = true)]
                private static extern IntPtr DispatchMessageW(ref MSG message);
                [DllImport("user32.dll")]
                private static extern void PostQuitMessage(int exitCode);
                [DllImport("kernel32.dll", SetLastError = true)]
                private static extern bool ProcessIdToSessionId(uint processId, out uint sessionId);
                [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
                private static extern IntPtr GetModuleHandle(string moduleName);
                [DllImport("kernel32.dll")]
                private static extern uint WTSGetActiveConsoleSessionId();
                [DllImport("user32.dll")]
                private static extern IntPtr GetProcessWindowStation();
                [DllImport("user32.dll")]
                private static extern IntPtr GetThreadDesktop(uint threadId);
                [DllImport("kernel32.dll")]
                private static extern uint GetCurrentThreadId();
                [DllImport("kernel32.dll")]
                private static extern void SetLastError(uint errorCode);
                [DllImport("user32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
                private static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder info, uint length, out uint needed);
                [DllImport("user32.dll", SetLastError = true)]
                private static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
                [DllImport("user32.dll")]
                private static extern bool CloseDesktop(IntPtr desktop);
                [DllImport("wtsapi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
                private static extern bool WTSQuerySessionInformation(IntPtr server, int sessionId, int infoClass, out IntPtr buffer, out int bytesReturned);
                [DllImport("wtsapi32.dll")]
                private static extern void WTSFreeMemory(IntPtr buffer);

                private static readonly ManualResetEvent WindowReady = new ManualResetEvent(false);
                private static readonly ManualResetEvent WindowClosed = new ManualResetEvent(false);
                private static readonly WindowProc ProbeWindowProcedure = HandleProbeWindowMessage;
                private static IntPtr probeHandle = IntPtr.Zero;
                private static uint probeUiThreadId;
                private static uint probeUiSessionId;
                private static string probeUiWindowStation = "";
                private static string probeUiDesktop = "";
                private static string probeUiInputDesktop = "";
                private static int probeUiInputDesktopError;
                private static string probeEvidenceRoot = "";

                public static int Main(string[] args)
                {
                    string evidenceRoot = args.Length == 1 ? args[0] : Environment.CurrentDirectory;
                    Directory.CreateDirectory(evidenceRoot);
                    Directory.CreateDirectory(Path.Combine(evidenceRoot, "runner"));
                    Directory.CreateDirectory(Path.Combine(evidenceRoot, "probe"));
                    try
                    {
                        Run(evidenceRoot);
                        return 0;
                    }
                    catch (Exception error)
                    {
                        File.WriteAllText(Path.Combine(evidenceRoot, "probe", "error.txt"), error.ToString());
                        return 1;
                    }
                }

                private static void Run(string evidenceRoot)
                {
                    Process current = Process.GetCurrentProcess();
                    string processAccount;
                    string processSid;
                    using (WindowsIdentity currentIdentity = WindowsIdentity.GetCurrent())
                    {
                        processAccount = currentIdentity.Name ?? "";
                        processSid = currentIdentity.User == null ? "" : currentIdentity.User.Value;
                    }
                    uint probeSession;
                    if (!ProcessIdToSessionId((uint)current.Id, out probeSession))
                        throw new InvalidOperationException("ProcessIdToSessionId failed for readiness probe");

                    uint activeConsoleSession = WTSGetActiveConsoleSessionId();
                    string sessionUser = QueryWtsString(probeSession, WTS_USER_NAME);
                    string sessionDomain = QueryWtsString(probeSession, WTS_DOMAIN_NAME);
                    string sessionAccount = sessionDomain + "\\" + sessionUser;
                    string sessionName = QueryWtsString(probeSession, WTS_WINSTATION_NAME);
                    int connectState = QueryWtsInt32(probeSession, WTS_CONNECT_STATE);
                    string windowStation = UserObjectName(GetProcessWindowStation());
                    string threadDesktop = UserObjectName(GetThreadDesktop(GetCurrentThreadId()));
                    IntPtr inputDesktopHandle = OpenInputDesktop(0, false, DESKTOP_READOBJECTS);
                    int inputDesktopError = inputDesktopHandle == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                    string inputDesktop = inputDesktopHandle == IntPtr.Zero ? "" : UserObjectName(inputDesktopHandle);
                    if (inputDesktopHandle != IntPtr.Zero) CloseDesktop(inputDesktopHandle);

                    List<int> workerPids = ProcessIdsInSession("Runner.Worker", probeSession);
                    List<int> listenerPids = ProcessIdsInSession("Runner.Listener", probeSession);
                    List<int> explorerPids = ProcessIdsInSession("explorer", probeSession);

                    string runnerName = Environment.GetEnvironmentVariable("RUNNER_NAME") ?? "";
                    string identity = "{\"machine\":\"" + Json(Environment.MachineName) +
                        "\",\"runnerName\":\"" + Json(runnerName) +
                        "\",\"processAccount\":\"" + Json(processAccount) +
                        "\",\"processSid\":\"" + Json(processSid) +
                        "\",\"probePid\":" + current.Id +
                        ",\"probeSessionId\":" + probeSession +
                        ",\"activeConsoleSessionId\":" + activeConsoleSession +
                        ",\"sessionUser\":\"" + Json(sessionUser) +
                        "\",\"sessionDomain\":\"" + Json(sessionDomain) +
                        "\",\"sessionAccount\":\"" + Json(sessionAccount) +
                        "\",\"sessionName\":\"" + Json(sessionName) +
                        "\",\"connectState\":" + connectState +
                        ",\"processWindowStation\":\"" + Json(windowStation) +
                        "\",\"threadDesktop\":\"" + Json(threadDesktop) +
                        "\",\"openInputDesktopSucceeded\":" + Bool(inputDesktopError == 0) +
                        ",\"inputDesktop\":\"" + Json(inputDesktop) +
                        "\",\"openInputDesktopError\":" + inputDesktopError +
                        ",\"runnerWorkerPidsInSession\":" + IntArray(workerPids) +
                        ",\"runnerListenerPidsInSession\":" + IntArray(listenerPids) +
                        ",\"explorerPidsInSession\":" + IntArray(explorerPids) + "}";
                    File.WriteAllText(Path.Combine(evidenceRoot, "runner", "identity-pre.json"), identity + Environment.NewLine, new UTF8Encoding(false));

                    Require(String.Equals(runnerName, ExpectedRunner, StringComparison.OrdinalIgnoreCase), "Runner name is not VSP-GUI-01");
                    Require(probeSession != 0, "Readiness probe is running in Session 0");
                    Require(activeConsoleSession != UInt32.MaxValue, "There is no active console session");
                    Require(probeSession == activeConsoleSession, "Runner session does not equal active console session");
                    Require(connectState == WTS_ACTIVE, "Runner WTS session is not Active");
                    Require(String.Equals(processAccount, ExpectedAccount, StringComparison.OrdinalIgnoreCase), "Readiness probe is not running as the approved interactive account");
                    Require(String.Equals(processSid, ExpectedSid, StringComparison.Ordinal), "Readiness probe SID does not match the approved interactive identity");
                    Require(String.Equals(sessionAccount, ExpectedAccount, StringComparison.OrdinalIgnoreCase), "Active WTS session does not belong to the approved interactive account");
                    Require(String.Equals(windowStation, "WinSta0", StringComparison.OrdinalIgnoreCase), "Process window station is not WinSta0");
                    Require(String.Equals(threadDesktop, "Default", StringComparison.OrdinalIgnoreCase), "Thread desktop is not Default");
                    Require(inputDesktopError == 0, "OpenInputDesktop failed");
                    Require(String.Equals(inputDesktop, "Default", StringComparison.OrdinalIgnoreCase), "Input desktop is not Default");
                    Require(workerPids.Count == 1, "Exactly one Runner.Worker must exist in the interactive session");
                    Require(listenerPids.Count == 1, "Exactly one Runner.Listener must exist in the interactive session");
                    Require(explorerPids.Count >= 1, "Explorer is absent from the interactive session");

                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "launch.json"),
                        "{\"title\":\"" + ProbeTitle + "\",\"width\":480,\"height\":240,\"expectedSamples\":3}" + Environment.NewLine,
                        new UTF8Encoding(false));

                    probeEvidenceRoot = evidenceRoot;
                    Thread uiThread = new Thread(RunWindow);
                    uiThread.Name = "VSP GUI Runner Readiness Probe UI";
                    uiThread.IsBackground = true;
                    uiThread.SetApartmentState(ApartmentState.STA);
                    uiThread.Start();

                    Require(WindowReady.WaitOne(TimeSpan.FromSeconds(10)), "Probe window did not initialize within 10 seconds");
                    Require(probeHandle != IntPtr.Zero, "Probe window handle is zero");

                    WindowRecord createdWindow = InspectWindow(probeHandle);
                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "created-window.json"),
                        WindowRecordJson(createdWindow) + Environment.NewLine, new UTF8Encoding(false));

                    int acceptedSamples = 0;
                    for (int sample = 1; sample <= 3; sample++)
                    {
                        WindowRecord knownWindow = InspectWindow(probeHandle);
                        EnumerationRecord enumWindows = CaptureEnumWindows((uint)current.Id);
                        EnumerationRecord enumThreadWindows = CaptureEnumThreadWindows(probeUiThreadId, (uint)current.Id);
                        EnumerationRecord enumDesktopWindows = CaptureEnumDesktopWindows((uint)current.Id);
                        WindowRecord record = enumWindows.MatchingWindow;
                        bool accepted = record != null && record.IsUnicode && record.Visible && record.Enabled && !record.Hung && record.Responsive &&
                            record.Rect.Right > record.Rect.Left && record.Rect.Bottom > record.Rect.Top;
                        if (accepted) acceptedSamples++;
                        AppendLine(Path.Combine(evidenceRoot, "probe", "window-samples.jsonl"), WindowJson(sample, record, accepted));
                        AppendLine(Path.Combine(evidenceRoot, "probe", "known-hwnd-samples.jsonl"),
                            "{\"sample\":" + sample + ",\"window\":" + WindowRecordJson(knownWindow) + "}");
                        File.WriteAllText(Path.Combine(evidenceRoot, "probe", "enumwindows-sample-" + sample + ".json"),
                            EnumerationJson(enumWindows) + Environment.NewLine, new UTF8Encoding(false));
                        File.WriteAllText(Path.Combine(evidenceRoot, "probe", "enumthreadwindows-sample-" + sample + ".json"),
                            EnumerationJson(enumThreadWindows) + Environment.NewLine, new UTF8Encoding(false));
                        File.WriteAllText(Path.Combine(evidenceRoot, "probe", "enumdesktopwindows-sample-" + sample + ".json"),
                            EnumerationJson(enumDesktopWindows) + Environment.NewLine, new UTF8Encoding(false));
                        AppendLine(Path.Combine(evidenceRoot, "probe", "process-samples.jsonl"),
                            "{\"sample\":" + sample + ",\"pid\":" + current.Id +
                            ",\"sessionId\":" + probeSession +
                            ",\"hasExited\":false,\"workingSet64\":" + current.WorkingSet64 +
                            ",\"totalProcessorMilliseconds\":" + current.TotalProcessorTime.TotalMilliseconds.ToString(CultureInfo.InvariantCulture) + "}");
                        if (sample < 3) Thread.Sleep(500);
                    }
                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "observation-summary.json"),
                        "{\"acceptanceSource\":\"PID-based EnumWindows\",\"expectedSamples\":3,\"acceptedSamples\":" + acceptedSamples + "}" + Environment.NewLine,
                        new UTF8Encoding(false));

                    bool closePosted = PostMessage(probeHandle, WM_CLOSE, IntPtr.Zero, IntPtr.Zero);
                    bool cleanClose = closePosted && WindowClosed.WaitOne(TimeSpan.FromSeconds(5)) && uiThread.Join(TimeSpan.FromSeconds(5));
                    bool handleGone = !IsWindow(probeHandle);
                    EnumerationRecord closeEnumeration = CaptureEnumWindows((uint)current.Id);
                    bool enumerationGone = closeEnumeration.MatchingWindow == null;
                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "enumwindows-after-close.json"),
                        EnumerationJson(closeEnumeration) + Environment.NewLine, new UTF8Encoding(false));
                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "close.json"),
                        "{\"wmClosePosted\":" + Bool(closePosted) +
                        ",\"cleanClose\":" + Bool(cleanClose) +
                        ",\"handleGone\":" + Bool(handleGone) +
                        ",\"enumWindowsGone\":" + Bool(enumerationGone) +
                        ",\"forcedKill\":false}" + Environment.NewLine,
                        new UTF8Encoding(false));

                    WritePostSessionEvidence(evidenceRoot, probeSession);
                    Require(probeUiSessionId == probeSession, "Probe UI thread session does not equal runner session");
                    Require(String.Equals(probeUiWindowStation, "WinSta0", StringComparison.OrdinalIgnoreCase), "Probe UI thread window station is not WinSta0");
                    Require(String.Equals(probeUiDesktop, "Default", StringComparison.OrdinalIgnoreCase), "Probe UI thread desktop is not Default");
                    Require(probeUiInputDesktopError == 0 && String.Equals(probeUiInputDesktop, "Default", StringComparison.OrdinalIgnoreCase), "Probe UI thread cannot access the Default input desktop");
                    Require(createdWindow.Exists, "Created probe HWND was not a valid window");
                    Require(createdWindow.ProcessId == (uint)current.Id, "Created probe HWND belonged to an unexpected process");
                    Require(createdWindow.ThreadId == probeUiThreadId, "Created probe HWND belonged to an unexpected thread");
                    Require(createdWindow.IsUnicode, "Created probe HWND is not a Unicode window");
                    Require(acceptedSamples == 3, "One or more PID-based EnumWindows visible/responsive samples failed acceptance");
                    Require(cleanClose, "Probe window did not close cleanly");
                    Require(handleGone, "Probe window handle remained valid after close");
                    Require(enumerationGone, "Probe window remained discoverable by PID-based EnumWindows after close");

                    File.WriteAllText(Path.Combine(evidenceRoot, "probe", "final-state.json"),
                        "{\"readinessResult\":\"PASS\",\"rc2ReleaseResult\":\"NOT_EVALUATED\",\"forcedKill\":false}" + Environment.NewLine,
                        new UTF8Encoding(false));
                }

                private static void RunWindow()
                {
                    try
                    {
                        probeUiThreadId = GetCurrentThreadId();
                        if (!ProcessIdToSessionId((uint)Process.GetCurrentProcess().Id, out probeUiSessionId))
                            throw new InvalidOperationException("ProcessIdToSessionId failed on the probe UI thread");
                        probeUiWindowStation = UserObjectName(GetProcessWindowStation());
                        probeUiDesktop = UserObjectName(GetThreadDesktop(probeUiThreadId));
                        IntPtr inputDesktop = OpenInputDesktop(0, false, DESKTOP_READOBJECTS);
                        probeUiInputDesktopError = inputDesktop == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                        probeUiInputDesktop = inputDesktop == IntPtr.Zero ? "" : UserObjectName(inputDesktop);
                        if (inputDesktop != IntPtr.Zero) CloseDesktop(inputDesktop);
                        File.WriteAllText(Path.Combine(probeEvidenceRoot, "runner", "ui-thread-identity.json"),
                            "{\"threadId\":" + probeUiThreadId +
                            ",\"sessionId\":" + probeUiSessionId +
                            ",\"processWindowStation\":\"" + Json(probeUiWindowStation) +
                            "\",\"threadDesktop\":\"" + Json(probeUiDesktop) +
                            "\",\"openInputDesktopSucceeded\":" + Bool(probeUiInputDesktopError == 0) +
                            ",\"inputDesktop\":\"" + Json(probeUiInputDesktop) +
                            "\",\"openInputDesktopError\":" + probeUiInputDesktopError + "}" + Environment.NewLine,
                            new UTF8Encoding(false));

                        IntPtr instance = GetModuleHandle(null);
                        var windowClass = new WNDCLASS
                        {
                            Style = CS_HREDRAW | CS_VREDRAW,
                            WindowProcedure = ProbeWindowProcedure,
                            Instance = instance,
                            Background = (IntPtr)(COLOR_WINDOW + 1),
                            ClassName = ProbeWindowClass
                        };

                        ushort atom = RegisterClassW(ref windowClass);
                        if (atom == 0)
                            throw new InvalidOperationException("RegisterClassW failed: " + Marshal.GetLastWin32Error().ToString(CultureInfo.InvariantCulture));

                        probeHandle = CreateWindowExW(
                            0,
                            ProbeWindowClass,
                            ProbeTitle,
                            WS_OVERLAPPEDWINDOW | WS_VISIBLE,
                            CW_USEDEFAULT,
                            CW_USEDEFAULT,
                            480,
                            240,
                            IntPtr.Zero,
                            IntPtr.Zero,
                            instance,
                            IntPtr.Zero);

                        if (probeHandle == IntPtr.Zero)
                            throw new InvalidOperationException("CreateWindowExW failed: " + Marshal.GetLastWin32Error().ToString(CultureInfo.InvariantCulture));

                        bool showWindowResult = ShowWindow(probeHandle, SW_SHOWNORMAL);
                        bool updateWindowResult = UpdateWindow(probeHandle);
                        File.WriteAllText(Path.Combine(probeEvidenceRoot, "probe", "ui-thread-window-creation.json"),
                            "{\"registerClassAtom\":" + atom +
                            ",\"showWindowReturn\":" + Bool(showWindowResult) +
                            ",\"updateWindowReturn\":" + Bool(updateWindowResult) +
                            ",\"window\":" + WindowRecordJson(InspectWindow(probeHandle)) + "}" + Environment.NewLine,
                            new UTF8Encoding(false));
                        WindowReady.Set();

                        MSG message;
                        int getMessageResult;
                        while ((getMessageResult = GetMessage(out message, IntPtr.Zero, 0, 0)) > 0)
                        {
                            TranslateMessage(ref message);
                            DispatchMessageW(ref message);
                        }
                        if (getMessageResult < 0)
                            throw new InvalidOperationException("GetMessage failed: " + Marshal.GetLastWin32Error().ToString(CultureInfo.InvariantCulture));
                    }
                    catch (Exception error)
                    {
                        File.WriteAllText(Path.Combine(probeEvidenceRoot, "probe", "ui-thread-error.txt"), error.ToString());
                        WindowReady.Set();
                    }
                }

                private static IntPtr HandleProbeWindowMessage(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam)
                {
                    if (message == WM_CLOSE)
                    {
                        DestroyWindow(hwnd);
                        return IntPtr.Zero;
                    }

                    if (message == WM_DESTROY)
                    {
                        WindowClosed.Set();
                        PostQuitMessage(0);
                        return IntPtr.Zero;
                    }

                    return DefWindowProcW(hwnd, message, wParam, lParam);
                }

                private static void WritePostSessionEvidence(string evidenceRoot, uint expectedSession)
                {
                    uint session;
                    ProcessIdToSessionId((uint)Process.GetCurrentProcess().Id, out session);
                    uint active = WTSGetActiveConsoleSessionId();
                    string station = UserObjectName(GetProcessWindowStation());
                    string desktop = UserObjectName(GetThreadDesktop(GetCurrentThreadId()));
                    IntPtr input = OpenInputDesktop(0, false, DESKTOP_READOBJECTS);
                    int inputError = input == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                    string inputName = input == IntPtr.Zero ? "" : UserObjectName(input);
                    if (input != IntPtr.Zero) CloseDesktop(input);
                    File.WriteAllText(Path.Combine(evidenceRoot, "runner", "identity-post.json"),
                        "{\"probeSessionId\":" + session +
                        ",\"expectedSessionId\":" + expectedSession +
                        ",\"activeConsoleSessionId\":" + active +
                        ",\"connectState\":" + QueryWtsInt32(session, WTS_CONNECT_STATE) +
                        ",\"processWindowStation\":\"" + Json(station) +
                        "\",\"threadDesktop\":\"" + Json(desktop) +
                        "\",\"openInputDesktopSucceeded\":" + Bool(inputError == 0) +
                        ",\"inputDesktop\":\"" + Json(inputName) +
                        "\",\"openInputDesktopError\":" + inputError + "}" + Environment.NewLine,
                        new UTF8Encoding(false));
                    Require(session == expectedSession && session == active && session != 0, "Session drift detected after probe close");
                    Require(QueryWtsInt32(session, WTS_CONNECT_STATE) == WTS_ACTIVE, "WTS session became inactive during readiness probe");
                    Require(String.Equals(station, "WinSta0", StringComparison.OrdinalIgnoreCase), "Window station drift detected");
                    Require(String.Equals(desktop, "Default", StringComparison.OrdinalIgnoreCase), "Desktop drift detected");
                    Require(inputError == 0 && String.Equals(inputName, "Default", StringComparison.OrdinalIgnoreCase), "Input desktop drift detected");
                }

                private static WindowRecord InspectWindow(IntPtr hwnd)
                {
                    bool exists = hwnd != IntPtr.Zero && IsWindow(hwnd);
                    uint pid = 0;
                    uint tid = exists ? GetWindowThreadProcessId(hwnd, out pid) : 0;
                    string title = "";
                    string className = "";
                    RECT rect = new RECT();
                    bool responsive = false;
                    int responsivenessError = 0;
                    bool isUnicode = false;
                    int getWindowTextLengthReturn = 0;
                    int getWindowTextReturn = 0;
                    if (exists)
                    {
                        isUnicode = IsWindowUnicode(hwnd);
                        getWindowTextLengthReturn = GetWindowTextLengthW(hwnd);
                        int textCapacity = Math.Max(Math.Max(getWindowTextLengthReturn + 1, ProbeTitle.Length + 1), 2);
                        var text = new StringBuilder(textCapacity);
                        getWindowTextReturn = GetWindowTextW(hwnd, text, text.Capacity);
                        title = text.ToString();
                        var classText = new StringBuilder(256);
                        GetClassNameW(hwnd, classText, classText.Capacity);
                        className = classText.ToString();
                        GetWindowRect(hwnd, out rect);
                        IntPtr response;
                        SetLastError(0);
                        responsive = SendMessageTimeout(hwnd, WM_NULL, IntPtr.Zero, IntPtr.Zero, SMTO_ABORTIFHUNG, 1000, out response) != IntPtr.Zero;
                        responsivenessError = responsive ? 0 : Marshal.GetLastWin32Error();
                    }
                    return new WindowRecord
                    {
                        Handle = hwnd,
                        ProcessId = pid,
                        ThreadId = tid,
                        Title = title,
                        ClassName = className,
                        Style = exists ? GetWindowLongPtr(hwnd, GWL_STYLE).ToInt64() : 0,
                        ExtendedStyle = exists ? GetWindowLongPtr(hwnd, GWL_EXSTYLE).ToInt64() : 0,
                        Exists = exists,
                        Visible = exists && IsWindowVisible(hwnd),
                        Enabled = exists && IsWindowEnabled(hwnd),
                        Hung = exists && IsHungAppWindow(hwnd),
                        Responsive = responsive,
                        ResponsivenessError = responsivenessError,
                        IsUnicode = isUnicode,
                        ExpectedTitleLength = ProbeTitle.Length,
                        GetWindowTextLengthReturn = getWindowTextLengthReturn,
                        GetWindowTextReturn = getWindowTextReturn,
                        ActualTitleLength = title.Length,
                        Rect = rect
                    };
                }

                private static EnumerationRecord CaptureEnumWindows(uint targetPid)
                {
                    var record = NewEnumerationRecord("EnumWindows");
                    EnumWindowsProc callback = BuildEnumerationCallback(record, targetPid);
                    SetLastError(0);
                    record.ApiResult = EnumWindows(callback, IntPtr.Zero);
                    record.LastError = record.ApiResult ? 0 : Marshal.GetLastWin32Error();
                    return record;
                }

                private static EnumerationRecord CaptureEnumThreadWindows(uint threadId, uint targetPid)
                {
                    var record = NewEnumerationRecord("EnumThreadWindows");
                    EnumWindowsProc callback = BuildEnumerationCallback(record, targetPid);
                    SetLastError(0);
                    record.ApiResult = EnumThreadWindows(threadId, callback, IntPtr.Zero);
                    record.LastError = record.ApiResult ? 0 : Marshal.GetLastWin32Error();
                    return record;
                }

                private static EnumerationRecord CaptureEnumDesktopWindows(uint targetPid)
                {
                    var record = NewEnumerationRecord("EnumDesktopWindows");
                    IntPtr desktop = OpenInputDesktop(0, false, DESKTOP_READOBJECTS | DESKTOP_ENUMERATE);
                    if (desktop == IntPtr.Zero)
                    {
                        record.ApiResult = false;
                        record.LastError = Marshal.GetLastWin32Error();
                        return record;
                    }
                    try
                    {
                        EnumWindowsProc callback = BuildEnumerationCallback(record, targetPid);
                        SetLastError(0);
                        record.ApiResult = EnumDesktopWindows(desktop, callback, IntPtr.Zero);
                        record.LastError = record.ApiResult ? 0 : Marshal.GetLastWin32Error();
                        return record;
                    }
                    finally { CloseDesktop(desktop); }
                }

                private static EnumerationRecord NewEnumerationRecord(string api)
                {
                    return new EnumerationRecord { Api = api };
                }

                private static EnumWindowsProc BuildEnumerationCallback(EnumerationRecord record, uint targetPid)
                {
                    return delegate(IntPtr hwnd, IntPtr ignored)
                    {
                        record.CallbackCount++;
                        uint pid;
                        GetWindowThreadProcessId(hwnd, out pid);
                        if (pid != targetPid) return true;
                        WindowRecord window = InspectWindow(hwnd);
                        record.ProcessWindows.Add(window);
                        if (record.MatchingWindow == null && String.Equals(window.Title, ProbeTitle, StringComparison.Ordinal))
                            record.MatchingWindow = window;
                        return true;
                    };
                }

                private static string EnumerationJson(EnumerationRecord record)
                {
                    var windows = new string[record.ProcessWindows.Count];
                    for (int index = 0; index < windows.Length; index++) windows[index] = WindowRecordJson(record.ProcessWindows[index]);
                    return "{\"api\":\"" + Json(record.Api) +
                        "\",\"apiResult\":" + Bool(record.ApiResult) +
                        ",\"lastError\":" + record.LastError +
                        ",\"callbackCount\":" + record.CallbackCount +
                        ",\"matchingWindow\":" + WindowRecordJson(record.MatchingWindow) +
                        ",\"processWindows\":[" + String.Join(",", windows) + "]}";
                }

                private static string WindowRecordJson(WindowRecord record)
                {
                    if (record == null) return "null";
                    return "{\"handle\":\"0x" + record.Handle.ToInt64().ToString("X", CultureInfo.InvariantCulture) +
                        "\",\"exists\":" + Bool(record.Exists) +
                        ",\"pid\":" + record.ProcessId +
                        ",\"threadId\":" + record.ThreadId +
                        ",\"title\":\"" + Json(record.Title) +
                        "\",\"expectedTitle\":\"" + Json(ProbeTitle) +
                        "\",\"expectedTitleLength\":" + record.ExpectedTitleLength +
                        ",\"getWindowTextLengthWReturn\":" + record.GetWindowTextLengthReturn +
                        ",\"getWindowTextWReturn\":" + record.GetWindowTextReturn +
                        ",\"actualTitleLength\":" + record.ActualTitleLength +
                        ",\"titleMatchesExpected\":" + Bool(String.Equals(record.Title, ProbeTitle, StringComparison.Ordinal)) +
                        ",\"className\":\"" + Json(record.ClassName) +
                        "\",\"style\":\"0x" + record.Style.ToString("X", CultureInfo.InvariantCulture) +
                        "\",\"extendedStyle\":\"0x" + record.ExtendedStyle.ToString("X", CultureInfo.InvariantCulture) +
                        "\",\"visible\":" + Bool(record.Visible) +
                        ",\"enabled\":" + Bool(record.Enabled) +
                        ",\"hung\":" + Bool(record.Hung) +
                        ",\"responsive\":" + Bool(record.Responsive) +
                        ",\"responsivenessError\":" + record.ResponsivenessError +
                        ",\"isWindowUnicode\":" + Bool(record.IsUnicode) +
                        ",\"rect\":{\"left\":" + record.Rect.Left +
                        ",\"top\":" + record.Rect.Top +
                        ",\"right\":" + record.Rect.Right +
                        ",\"bottom\":" + record.Rect.Bottom + "}}";
                }

                private static string WindowJson(int sample, WindowRecord record, bool accepted)
                {
                    if (record == null)
                        return "{\"sample\":" + sample + ",\"found\":false,\"accepted\":false}";
                    return "{\"sample\":" + sample +
                        ",\"found\":true,\"accepted\":" + Bool(accepted) +
                        ",\"pid\":" + record.ProcessId +
                        ",\"threadId\":" + record.ThreadId +
                        ",\"handle\":\"0x" + record.Handle.ToInt64().ToString("X", CultureInfo.InvariantCulture) +
                        "\",\"title\":\"" + Json(record.Title) +
                        "\",\"expectedTitleLength\":" + record.ExpectedTitleLength +
                        ",\"getWindowTextLengthWReturn\":" + record.GetWindowTextLengthReturn +
                        ",\"getWindowTextWReturn\":" + record.GetWindowTextReturn +
                        ",\"actualTitleLength\":" + record.ActualTitleLength +
                        ",\"titleMatchesExpected\":" + Bool(String.Equals(record.Title, ProbeTitle, StringComparison.Ordinal)) +
                        ",\"isWindowUnicode\":" + Bool(record.IsUnicode) +
                        ",\"visible\":" + Bool(record.Visible) +
                        ",\"enabled\":" + Bool(record.Enabled) +
                        ",\"hung\":" + Bool(record.Hung) +
                        ",\"responsive\":" + Bool(record.Responsive) +
                        ",\"rect\":{\"left\":" + record.Rect.Left +
                        ",\"top\":" + record.Rect.Top +
                        ",\"right\":" + record.Rect.Right +
                        ",\"bottom\":" + record.Rect.Bottom + "}}";
                }

                private static List<int> ProcessIdsInSession(string processName, uint session)
                {
                    var ids = new List<int>();
                    foreach (Process process in Process.GetProcessesByName(processName))
                    {
                        try
                        {
                            uint candidate;
                            if (ProcessIdToSessionId((uint)process.Id, out candidate) && candidate == session) ids.Add(process.Id);
                        }
                        finally { process.Dispose(); }
                    }
                    ids.Sort();
                    return ids;
                }

                private static string QueryWtsString(uint sessionId, int infoClass)
                {
                    IntPtr buffer;
                    int bytes;
                    if (!WTSQuerySessionInformation(IntPtr.Zero, (int)sessionId, infoClass, out buffer, out bytes)) return "";
                    try { return buffer == IntPtr.Zero ? "" : (Marshal.PtrToStringUni(buffer) ?? ""); }
                    finally { if (buffer != IntPtr.Zero) WTSFreeMemory(buffer); }
                }

                private static int QueryWtsInt32(uint sessionId, int infoClass)
                {
                    IntPtr buffer;
                    int bytes;
                    if (!WTSQuerySessionInformation(IntPtr.Zero, (int)sessionId, infoClass, out buffer, out bytes) || buffer == IntPtr.Zero) return -1;
                    try { return Marshal.ReadInt32(buffer); }
                    finally { WTSFreeMemory(buffer); }
                }

                private static string UserObjectName(IntPtr handle)
                {
                    if (handle == IntPtr.Zero) return "";
                    uint needed;
                    GetUserObjectInformation(handle, UOI_NAME, null, 0, out needed);
                    if (needed == 0) return "";
                    var buffer = new StringBuilder((int)(needed / 2) + 2);
                    return GetUserObjectInformation(handle, UOI_NAME, buffer, needed, out needed) ? buffer.ToString() : "";
                }

                private static string IntArray(List<int> values)
                {
                    var items = new string[values.Count];
                    for (int index = 0; index < values.Count; index++) items[index] = values[index].ToString(CultureInfo.InvariantCulture);
                    return "[" + String.Join(",", items) + "]";
                }

                private static void Require(bool condition, string message)
                {
                    if (!condition) throw new InvalidOperationException(message);
                }

                private static void AppendLine(string path, string line)
                {
                    File.AppendAllText(path, line + Environment.NewLine, new UTF8Encoding(false));
                }

                private static string Bool(bool value) { return value ? "true" : "false"; }
                private static string Json(string value)
                {
                    if (value == null) return "";
                    return value.Replace("\\", "\\\\").Replace("\"", "\\\"").Replace("\r", "\\r").Replace("\n", "\\n");
                }
            }
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllText(
            $env:READINESS_HELPER_SOURCE,
            $env:READINESS_PROBE_SOURCE,
            [Text.UTF8Encoding]::new($false)
          )
          $hash = (Get-FileHash -LiteralPath $env:READINESS_HELPER_SOURCE -Algorithm SHA256).Hash
          ('READINESS_PROBE_SOURCE_SHA256=' + $hash) | Set-Content `
            -LiteralPath (Join-Path $env:READINESS_EVIDENCE_ROOT 'provenance\runtime-helper.txt') `
            -Encoding ascii
          try {
            Add-Type -Path $env:READINESS_HELPER_SOURCE `
              -ReferencedAssemblies @(
                'System.dll',
                'System.Core.dll'
              ) `
              -OutputAssembly $env:READINESS_HELPER_EXE `
              -OutputType ConsoleApplication
          } catch {
            $diagnosticsPath = Join-Path $env:READINESS_EVIDENCE_ROOT 'provenance\compiler-diagnostics.txt'
            @(
              'ADD_TYPE_FAILED'
              ('READINESS_HELPER_SOURCE=' + $env:READINESS_HELPER_SOURCE)
              ('READINESS_HELPER_EXE=' + $env:READINESS_HELPER_EXE)
              ('READINESS_PROBE_SOURCE_SHA256=' + $hash)
              ''
              'PRIMARY_ERROR'
              ($_ | Out-String)
              ''
              'ERROR_RECORDS'
              ($Error | Out-String)
            ) | Set-Content -LiteralPath $diagnosticsPath -Encoding utf8
            throw
          }

      - name: Validate interactive session and non-VSP GUI window
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& $env:READINESS_HELPER_EXE $env:READINESS_EVIDENCE_ROOT; $code=$LASTEXITCODE; ('READINESS_PROBE_EXIT_CODE=' + $code) | Set-Content -LiteralPath (Join-Path $env:READINESS_EVIDENCE_ROOT 'probe\exit-code.txt') -Encoding ascii; if ($code -ne 0) { exit $code }"

      - name: Record readiness summary
        if: always()
        env:
          READINESS_JOB_STATUS: ${{ job.status }}
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$summary=Join-Path $env:READINESS_EVIDENCE_ROOT 'READINESS_SUMMARY.md'; @('# VSP GUI Runner Readiness','',('- Readiness job status at summary: `' + $env:READINESS_JOB_STATUS + '`'),'- RC2 release result: `NOT_EVALUATED`','- RC2-001 authoritative run `32561743888` remains `FAIL`','- RC2-002 diagnostic run `32571209557` remains diagnostic-only','- RC2-003 authoritative readiness run `32587312778` remains materialization-defect `FAIL`','- RC2-003B authoritative readiness run `32611054978` remains observability-defect `FAIL`','- RC2-003C authoritative readiness run `32618714861` remains Unicode-ANSI-interop-defect `FAIL`',('- Readiness run ID: `' + $env:GITHUB_RUN_ID + '`'),('- Readiness run attempt: `' + $env:GITHUB_RUN_ATTEMPT + '`'),('- Runner name: `' + $env:RUNNER_NAME + '`'),'','PASS means only that the interactive GUI runner environment is ready. It does not mean RC2 passed and does not authorize Replacement Release Validation.') | Set-Content -LiteralPath $summary -Encoding utf8"

      - name: Upload RC2-003 readiness evidence
        id: upload-readiness-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vsp-gui-runner-readiness-run-${{ github.run_id }}
          path: ${{ env.READINESS_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary readiness data after preserved upload
        if: always() && steps.upload-readiness-evidence.outcome == 'success'
        run: |
          if exist "%READINESS_HELPER_SOURCE%" del /q "%READINESS_HELPER_SOURCE%"
          if exist "%READINESS_HELPER_EXE%" del /q "%READINESS_HELPER_EXE%"
          if exist "%READINESS_EVIDENCE_ROOT%" rmdir /s /q "%READINESS_EVIDENCE_ROOT%"
