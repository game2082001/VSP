name: AI02 Claude Artifact Developer

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: AI02 task ID to execute
        required: true
        type: string
      manifest_path:
        description: Repository path to the approved AI02 task manifest
        required: true
        type: string
      state_path:
        description: Repository path to the AI02 task state
        required: true
        type: string
      expected_base_sha:
        description: Expected base SHA for the developer working tree
        required: true
        type: string
      phased_child:
        description: Enable credentialless predecessor materialization for an approved A1/A2/A3 child
        required: false
        default: false
        type: boolean
      child_phase:
        description: Approved child phase (A1, A2, or A3)
        required: false
        default: ""
        type: string
      child_sequence:
        description: Approved child sequence (1, 2, or 3)
        required: false
        default: "0"
        type: string
      child_workflow_id:
        description: Numeric immutable workflow identity recorded in the predecessor descriptor
        required: false
        default: ""
        type: string
      predecessor_bindings_json:
        description: Immutable predecessor artifact bindings; use [] for A1
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  claude-developer:
    name: Claude Primary Developer Artifact Package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout expected base without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate AI02 task before Claude invocation
        id: validate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.task_id }}" -notmatch '^VSP-AI02-[A-Za-z0-9-]+$') {
            throw "Invalid AI02 task_id input."
          }

          $validationJson = ./tools/orchestrator/claude-artifact-developer.ps1 `
            -ManifestPath "${{ inputs.manifest_path }}" `
            -StatePath "${{ inputs.state_path }}" `
            -ExpectedBaseSha "${{ inputs.expected_base_sha }}" `
            -Repository "${{ github.repository }}" `
            -ValidateOnly
          $validationJson
          $validation = $validationJson | ConvertFrom-Json
          if ($validation.taskId -ne "${{ inputs.task_id }}") {
            throw "Validated taskId does not match workflow input."
          }
          if ($validation.repositoryWriteCredentialAvailableToDeveloper -ne $false) {
            throw "Developer credential boundary validation failed."
          }
          "task_id=$($validation.taskId)" >> $env:GITHUB_OUTPUT

      - name: Classify phased predecessor source
        id: predecessor_route
        if: inputs.phased_child
        shell: pwsh
        env:
          AI02_PREDECESSOR_BINDINGS: ${{ inputs.predecessor_bindings_json }}
          AI02_CHILD_PHASE: ${{ inputs.child_phase }}
          AI02_CHILD_SEQUENCE: ${{ inputs.child_sequence }}
          AI02_CHILD_WORKFLOW_ID: ${{ inputs.child_workflow_id }}
          AI02_CHILD_TASK_ID: ${{ inputs.task_id }}
          AI02_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          AI02_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:AI02_CHILD_PHASE -notmatch '^A[1-3]$' -or $env:AI02_CHILD_SEQUENCE -notmatch '^[1-3]$' -or $env:AI02_CHILD_WORKFLOW_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw "Invalid phased-child identity input."
          }
          if ($env:AI02_CHILD_PHASE -eq "A1") {
            if ($env:AI02_PREDECESSOR_BINDINGS -ne "[]") { throw "A1 must bind no predecessors." }
            "route=GENESIS" >> $env:GITHUB_OUTPUT
          }
          else {
            $routeJson = ./tools/orchestrator/ai02-artifact-chain.ps1 -Mode ClassifyBindings -Repository "${{ github.repository }}" -BindingsJson $env:AI02_PREDECESSOR_BINDINGS
            $route = $routeJson | ConvertFrom-Json
            if ($route.route -notin @("ACTIONS_ARTIFACT", "AUTHORITATIVE_REPOSITORY_MERGE")) { throw "Unsupported predecessor source combination." }
            "route=$($route.route)" >> $env:GITHUB_OUTPUT
          }

      - name: Initialize GENESIS predecessor state
        if: inputs.phased_child && steps.predecessor_route.outputs.route == 'GENESIS'
        shell: pwsh
        run: |
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode InitializeWorkspace `
            -RecoveryRepositorySha "${{ inputs.expected_base_sha }}" `
            -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json"

      - name: Acquire Actions artifact predecessors
        if: inputs.phased_child && steps.predecessor_route.outputs.route == 'ACTIONS_ARTIFACT'
        shell: pwsh
        env:
          AI02_ARTIFACT_READ_TOKEN: ${{ github.token }}
          AI02_PREDECESSOR_BINDINGS: ${{ inputs.predecessor_bindings_json }}
        run: |
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode AcquireAndMaterialize `
            -Repository "${{ github.repository }}" `
            -RecoveryRepositorySha "${{ inputs.expected_base_sha }}" `
            -WorkspacePath "${{ github.workspace }}" `
            -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json" `
            -BindingsJson $env:AI02_PREDECESSOR_BINDINGS
          Remove-Item Env:AI02_ARTIFACT_READ_TOKEN -ErrorAction SilentlyContinue

      - name: Materialize authoritative repository predecessors
        if: inputs.phased_child && steps.predecessor_route.outputs.route == 'AUTHORITATIVE_REPOSITORY_MERGE'
        shell: pwsh
        env:
          AI02_PREDECESSOR_BINDINGS: ${{ inputs.predecessor_bindings_json }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:AI02_ARTIFACT_READ_TOKEN) -or -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or -not [string]::IsNullOrEmpty($env:GITHUB_TOKEN)) { throw "Repository-merge route received a credential." }
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode AcquireAndMaterialize `
            -Repository "${{ github.repository }}" `
            -RecoveryRepositorySha "${{ inputs.expected_base_sha }}" `
            -WorkspacePath "${{ github.workspace }}" `
            -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json" `
            -EvidenceDirectory "${{ runner.temp }}/ai02-predecessor-evidence" `
            -BindingsJson $env:AI02_PREDECESSOR_BINDINGS

      - name: Validate phased child authorization
        id: materialize
        if: inputs.phased_child
        shell: pwsh
        env:
          AI02_CHILD_PHASE: ${{ inputs.child_phase }}
          AI02_CHILD_SEQUENCE: ${{ inputs.child_sequence }}
          AI02_CHILD_TASK_ID: ${{ inputs.task_id }}
          AI02_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          AI02_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode ValidateChildAuthorization `
            -ChildTaskId $env:AI02_CHILD_TASK_ID `
            -ChildPhase $env:AI02_CHILD_PHASE `
            -Sequence ([int]$env:AI02_CHILD_SEQUENCE) `
            -RecoveryRepositorySha $env:AI02_EXPECTED_BASE_SHA `
            -ManifestPath $env:AI02_MANIFEST_PATH `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json"
          "baseline_sha256=$((Get-FileHash -LiteralPath '${{ runner.temp }}/ai02-predecessor-baseline.json' -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "aggregate_state_sha256=$((Get-FileHash -LiteralPath '${{ runner.temp }}/ai02-aggregate-state.json' -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify Claude receives no artifact or repository credential
        if: inputs.phased_child
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::IsNullOrEmpty($env:AI02_ARTIFACT_READ_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GH_TOKEN) -or
              -not [string]::IsNullOrEmpty($env:GITHUB_TOKEN)) {
            throw "A repository or artifact credential reached the Claude execution environment."
          }

      - name: Prepare Claude prompt from validated task state
        id: prompt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $promptResultJson = ./tools/orchestrator/claude-artifact-developer.ps1 `
            -ManifestPath "${{ inputs.manifest_path }}" `
            -StatePath "${{ inputs.state_path }}" `
            -ExpectedBaseSha "${{ inputs.expected_base_sha }}" `
            -Repository "${{ github.repository }}" `
            -OutputDirectory "${{ runner.temp }}/ai02-claude-developer" `
            -PreparePrompt
          $promptResultJson
          $promptResult = $promptResultJson | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($promptResult.promptPath) -or -not (Test-Path -LiteralPath $promptResult.promptPath)) {
            throw "Prepared Claude prompt file was not created."
          }

          $promptText = Get-Content -LiteralPath $promptResult.promptPath -Raw
          if ([string]::IsNullOrWhiteSpace($promptText)) {
            throw "Prepared Claude prompt is empty."
          }

          $delimiter = "AI02_CLAUDE_PROMPT_$([Guid]::NewGuid().ToString('N'))"
          "prompt<<$delimiter" >> $env:GITHUB_OUTPUT
          $promptText >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Run Claude Code Primary Developer
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: '--allowedTools "Read,Write,Edit" --disallowedTools "Bash(git push:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr merge:*),Bash(gh api repos/*/git/refs:*),Bash(gh api repos/*/pulls:*)"'

      - name: Record post-Claude working-tree diagnostics
        if: always() && steps.validate.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/orchestrator/claude-artifact-developer.ps1 `
            -ManifestPath "${{ inputs.manifest_path }}" `
            -StatePath "${{ inputs.state_path }}" `
            -ExpectedBaseSha "${{ inputs.expected_base_sha }}" `
            -Repository "${{ github.repository }}" `
            -OutputDirectory "${{ runner.temp }}/ai02-claude-diagnostics" `
            -ClaudeConclusion "${{ steps.claude.conclusion }}" `
            -ClaudeSessionId "${{ steps.claude.outputs.session_id }}" `
            -ClaudeExecutionFile "${{ steps.claude.outputs.execution_file }}" `
            -ClaudePermissionDenialCount "${{ steps.claude.outputs.permission_denials_count }}" `
            -DiagnosePostClaude

      - name: Package runner working-tree changes
        if: always() && steps.validate.outcome == 'success' && !inputs.phased_child
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/orchestrator/claude-artifact-developer.ps1 `
            -ManifestPath "${{ inputs.manifest_path }}" `
            -StatePath "${{ inputs.state_path }}" `
            -ExpectedBaseSha "${{ inputs.expected_base_sha }}" `
            -Repository "${{ github.repository }}" `
            -OutputDirectory "${{ runner.temp }}/ai02-publication-package" `
            -Package

      - name: Validate predecessor immutability and package phased child
        if: always() && steps.validate.outcome == 'success' && inputs.phased_child
        shell: pwsh
        env:
          AI02_MANIFEST_PATH: ${{ inputs.manifest_path }}
          AI02_BASELINE_SHA256: ${{ steps.materialize.outputs.baseline_sha256 }}
          AI02_AGGREGATE_STATE_SHA256: ${{ steps.materialize.outputs.aggregate_state_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode ValidatePostClaude `
            -WorkspacePath "${{ github.workspace }}" `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json" `
            -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
            -ExpectedBaselineSha256 $env:AI02_BASELINE_SHA256 `
            -ExpectedAggregateStateSha256 $env:AI02_AGGREGATE_STATE_SHA256
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode PackageChild `
            -WorkspacePath "${{ github.workspace }}" `
            -BaselinePath "${{ runner.temp }}/ai02-predecessor-baseline.json" `
            -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
            -ExpectedBaselineSha256 $env:AI02_BASELINE_SHA256 `
            -ExpectedAggregateStateSha256 $env:AI02_AGGREGATE_STATE_SHA256 `
            -ManifestPath $env:AI02_MANIFEST_PATH `
            -OutputDirectory "${{ runner.temp }}/ai02-publication-package"

      - name: Upload AI02 publication package artifact
        id: publication_package
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai02-claude-publication-package-${{ inputs.task_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ai02-publication-package/publication-package.zip
            ${{ runner.temp }}/ai02-publication-package/publication-package.manifest.json
            ${{ runner.temp }}/ai02-publication-package/publication-package.result.json
          if-no-files-found: error
          overwrite: false

      - name: Create and validate phased-child predecessor descriptor
        if: always() && steps.publication_package.outcome == 'success' && inputs.phased_child
        shell: pwsh
        env:
          AI02_CHILD_PHASE: ${{ inputs.child_phase }}
          AI02_CHILD_SEQUENCE: ${{ inputs.child_sequence }}
          AI02_CHILD_WORKFLOW_ID: ${{ inputs.child_workflow_id }}
          AI02_CHILD_TASK_ID: ${{ inputs.task_id }}
          AI02_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          AI02_PACKAGE_ARTIFACT_ID: ${{ steps.publication_package.outputs.artifact-id }}
          AI02_PACKAGE_ARTIFACT_DIGEST: ${{ steps.publication_package.outputs.artifact-digest }}
          AI02_PACKAGE_ARTIFACT_NAME: ai02-claude-publication-package-${{ inputs.task_id }}-${{ github.run_id }}
          AI02_PREDECESSOR_ROUTE: ${{ steps.predecessor_route.outputs.route }}
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/orchestrator/ai02-artifact-chain.ps1 `
            -Mode NewDescriptor `
            -OutputDirectory "${{ runner.temp }}/ai02-publication-package" `
            -ChildTaskId $env:AI02_CHILD_TASK_ID `
            -ChildPhase $env:AI02_CHILD_PHASE `
            -Sequence ([int]$env:AI02_CHILD_SEQUENCE) `
            -RecoveryRepositorySha $env:AI02_EXPECTED_BASE_SHA `
            -WorkflowId $env:AI02_CHILD_WORKFLOW_ID `
            -RunId "${{ github.run_id }}" `
            -RunAttempt ${{ github.run_attempt }} `
            -ArtifactId $env:AI02_PACKAGE_ARTIFACT_ID `
            -ArtifactName $env:AI02_PACKAGE_ARTIFACT_NAME `
            -GitHubArtifactDigest $env:AI02_PACKAGE_ARTIFACT_DIGEST
          if ($env:AI02_PREDECESSOR_ROUTE -eq "AUTHORITATIVE_REPOSITORY_MERGE") {
            $checkpointEvidence = @(Get-ChildItem -LiteralPath "${{ runner.temp }}/ai02-predecessor-evidence" -Filter "*-checkpoint.json" | Sort-Object Name | ForEach-Object FullName)
            $descriptorEvidence = @(Get-ChildItem -LiteralPath "${{ runner.temp }}/ai02-predecessor-evidence" -Filter "*-descriptor.json" | Sort-Object Name | ForEach-Object FullName)
            $resultEvidence = @(Get-ChildItem -LiteralPath "${{ runner.temp }}/ai02-predecessor-evidence" -Filter "*-result.json" | Sort-Object Name | ForEach-Object FullName)
            $publicationEvidence = @(Get-ChildItem -LiteralPath "${{ runner.temp }}/ai02-predecessor-evidence" -Filter "*-publication.json" | Sort-Object Name | ForEach-Object FullName)
            ./tools/orchestrator/ai02-artifact-chain.ps1 `
              -Mode NewCheckpointV2 `
              -Repository "${{ github.repository }}" `
              -WorkspacePath "${{ github.workspace }}" `
              -CheckpointEvidencePaths $checkpointEvidence `
              -DescriptorEvidencePaths $descriptorEvidence `
              -PackageResultEvidencePaths $resultEvidence `
              -PublicationEvidencePaths $publicationEvidence `
              -ChildDescriptorPath "${{ runner.temp }}/ai02-publication-package/predecessor-descriptor.json" `
              -ChildPackageResultPath "${{ runner.temp }}/ai02-publication-package/publication-package.result.json" `
              -CheckpointPath "${{ runner.temp }}/ai02-aggregate-state.json"
          }
          else {
            ./tools/orchestrator/ai02-artifact-chain.ps1 `
              -Mode AppendDescriptor `
              -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json" `
              -DescriptorPath "${{ runner.temp }}/ai02-publication-package/predecessor-descriptor.json"
          }
          if ($env:AI02_CHILD_PHASE -eq "A3" -and $env:AI02_PREDECESSOR_ROUTE -ne "AUTHORITATIVE_REPOSITORY_MERGE") {
            ./tools/orchestrator/ai02-artifact-chain.ps1 `
              -Mode ValidateFinalAggregate `
              -WorkspacePath "${{ github.workspace }}" `
              -AggregateStatePath "${{ runner.temp }}/ai02-aggregate-state.json"
          }

      - name: Upload phased-child predecessor descriptor
        if: always() && steps.publication_package.outcome == 'success' && inputs.phased_child
        uses: actions/upload-artifact@v4
        with:
          name: ai02-predecessor-descriptor-${{ inputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai02-publication-package/predecessor-descriptor.json
          if-no-files-found: error
          overwrite: false

      - name: Upload phased-child aggregate checkpoint
        if: always() && steps.publication_package.outcome == 'success' && inputs.phased_child && steps.predecessor_route.outputs.route == 'AUTHORITATIVE_REPOSITORY_MERGE'
        uses: actions/upload-artifact@v4
        with:
          name: ai02-aggregate-checkpoint-${{ inputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai02-aggregate-state.json
          if-no-files-found: error
          overwrite: false

      - name: Upload sanitized Claude diagnostic artifact
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai02-claude-developer-sanitized-diagnostics-${{ inputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai02-claude-diagnostics/post-claude-diagnostics.sanitized.json
          if-no-files-found: error
          overwrite: false
