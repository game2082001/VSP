name: VSP Windows CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (Windows self-hosted)
    runs-on: [self-hosted, Windows, X64, vsp-server]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info
          $sdks = dotnet --list-sdks
          if (-not ($sdks | Select-String '^10\.')) {
            Write-Error "Required .NET 10 SDK not found on this runner. Installed SDKs:`n$sdks"
            exit 1
          }
          Write-Host "Found required .NET 10 SDK on runner:"
          $sdks | Select-String '^10\.'

      - name: Restore
        run: dotnet restore VSP.slnx

      - name: Build (Debug)
        run: dotnet build VSP.slnx -c Debug --no-restore

      - name: Test (VSP.Tests, Debug)
        run: dotnet test VSP.Tests/VSP.Tests.csproj -c Debug --no-build
